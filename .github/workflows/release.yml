name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-amd64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          for bin in phil any2mcp; do
            cp target/${{ matrix.target }}/release/$bin dist/ 2>/dev/null || true
          done
          cd dist
          tar czf ../phil-${{ matrix.name }}.tar.gz *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phil-${{ matrix.name }}
          path: phil-${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute checksums
        run: |
          cd artifacts
          find . -name '*.tar.gz' -exec mv {} . \;
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: phil-darwin-arm64
          path: artifacts

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum artifacts/phil-darwin-arm64.tar.gz | awk '{print $1}')

          cat > phil.rb <<'FORMULA'
          class Phil < Formula
            desc "Pipe anything through AI — local LLM CLI with packs, agent mode, and MCP"
            homepage "https://github.com/alvaro-atlasai/phil"
            url "https://github.com/alvaro-atlasai/phil/releases/download/v__VERSION__/phil-darwin-arm64.tar.gz"
            sha256 "__SHA256__"
            license "MIT"

            def install
              bin.install "phil"
              bin.install "any2mcp"
            end

            test do
              assert_match "phil", shell_output("#{bin}/phil --version")
            end
          end
          FORMULA

          sed -i 's/^          //' phil.rb
          sed -i "s/__VERSION__/${VERSION}/g" phil.rb
          sed -i "s/__SHA256__/${SHA256}/g" phil.rb

          if [ -n "$TAP_TOKEN" ]; then
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/alvaro-atlasai/homebrew-tap.git" tap
            mkdir -p tap/Formula
            cp phil.rb tap/Formula/phil.rb
            cd tap
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/phil.rb
            git commit -m "phil v${VERSION}" || true
            git push
          else
            echo "::warning::TAP_TOKEN not set — skipping Homebrew tap update"
            echo "Formula that would be published:"
            cat phil.rb
          fi
